name: Go
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make test-postgres
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dataset: [lineitem, acs, iot, icu]
        # transfer: one worker per stage; transfer_multi: several workers per stage
        config: [transfer, transfer_multi]
    steps:
      - uses: actions/checkout@v4
      - run: make e2e DATASET=${{ matrix.dataset }} TRANSFER_CONFIG=${{ matrix.config }}
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
  multi-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transfer between isolated source and target stacks
        run: XDBC_TEST_HOST_IP="$(hostname -I | awk '{print $1}')" ./scripts/e2e-multi-machine.sh
