x-app: &app
  image: xdbc-replication:local
  build: .
  environment: &app-env
    CONFIG_PATH: testdata/${DATASET:-iot}/transfer.json
    DATA_FILE: /data/${FILE:-${DATASET:-iot}.csv}
    COMPRESSION: ${COMPRESSION:-snappy}
    TRANSFER_TIMEOUT: ${TRANSFER_TIMEOUT:-1m}
  init: true
  healthcheck:
    test: ["CMD", "harness", "health"]
    interval: 2s
    timeout: 3s
    retries: 30

x-postgres: &postgres
  image: postgres:17
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: xdbc_test
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d xdbc_test"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  source-db:
    <<: *postgres
    ports:
      - "${SOURCE_DB_BIND_IP:-127.0.0.1}:${SOURCE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - source_data:/var/lib/postgresql/data

  target-db:
    <<: *postgres
    ports:
      - "${TARGET_DB_BIND_IP:-127.0.0.1}:${TARGET_POSTGRES_PORT:-5434}:5432"
    volumes:
      - target_data:/var/lib/postgresql/data

  server:
    <<: *app
    command: ["server"]
    environment:
      <<: *app-env
      DATABASE_URL: ${SOURCE_DATABASE_URL:-postgres://postgres:postgres@source-db:5432/xdbc_test?sslmode=disable}
      CLIENT_URL: http://localhost:8080
    ports:
      - "${SERVER_BIND_IP:-127.0.0.1}:${SERVER_PORT:-9000}:9000"
    depends_on:
      source-db:
        condition: service_healthy

  client:
    <<: *app
    command: ["client"]
    user: "${LOCAL_UID:-65532}:${LOCAL_GID:-65532}"
    environment:
      <<: *app-env
      DATABASE_URL: ${TARGET_DATABASE_URL:-postgres://postgres:postgres@target-db:5432/xdbc_test?sslmode=disable}
      SERVER_ADDR: ${SERVER_ADDR:-server:9000}
      SINK_TYPE: ${SINK_TYPE:-postgres}
      CSV_OUTPUT_PATH: ${CSV_OUTPUT_PATH:-/exports/${DATASET:-iot}.csv}
      CLIENT_URL: http://localhost:8080
    ports:
      - "${CLIENT_BIND_IP:-127.0.0.1}:${CLIENT_PORT:-8080}:8080"
    volumes:
      - ./exports:/exports:z
    depends_on:
      target-db:
        condition: service_healthy
      server:
        condition: service_healthy

  tools:
    <<: *app
    profiles: ["tools"]
    volumes:
      - ${DATA_DIR:-./data}:/data:ro,z
      - ./exports:/exports:ro,z
    entrypoint: ["harness"]
    command: ["verify"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-postgres://postgres:postgres@source-db:5432/xdbc_test?sslmode=disable}
      TARGET_DATABASE_URL: ${TARGET_DATABASE_URL:-postgres://postgres:postgres@target-db:5432/xdbc_test?sslmode=disable}
      SINK_TYPE: ${SINK_TYPE:-postgres}
      CSV_OUTPUT_PATH: ${CSV_OUTPUT_PATH:-/exports/${DATASET:-iot}.csv}
      CLIENT_URL: ${CLIENT_URL:-http://client:8080}
      SERVER_URL: ${SERVER_URL:-http://server:8080}

  # Fig. 9b benchmark, one command on any machine with Docker:
  #   docker compose run --build --rm bench
  # Options go in with -e, e.g. -e DATASETS=all -e JDBC=faithful. See bench/README.md.
  # It has its own databases, so it never touches the dev stack's data.
  # Two machines: see "Two machines" in bench/README.md (node A runs bench-source
  # and bench-server with BENCH_BIND_IP=0.0.0.0; node B runs bench with SOURCE_HOST).
  bench-source:
    <<: *postgres
    profiles: ["bench"]
    ports:
      - "${BENCH_BIND_IP:-127.0.0.1}:${BENCH_SOURCE_PORT:-5435}:5432"
    volumes:
      - bench_source:/var/lib/postgresql/data

  # Our XDBC server next to the source database, for two-machine runs (node A).
  bench-server:
    <<: *app
    profiles: ["bench"]
    command: ["server"]
    environment:
      CONFIG_PATH: testdata/${DATASET:-iot}/transfer.json
      DATABASE_URL: postgres://postgres:postgres@bench-source:5432/xdbc_test?sslmode=disable
      COMPRESSION: ${COMPRESSION:-snappy}
      TRANSFER_TIMEOUT: 60m
      CLIENT_URL: http://localhost:8080
    ports:
      - "${BENCH_BIND_IP:-127.0.0.1}:9000:9000"
      - "${BENCH_BIND_IP:-127.0.0.1}:8090:8080"
    depends_on:
      bench-source:
        condition: service_healthy

  bench-target:
    <<: *postgres
    profiles: ["bench"]
    image: xdbc-bench-target:local
    build: bench/jdbc
    volumes:
      - bench_target:/var/lib/postgresql/data

  bench:
    <<: *app
    profiles: ["bench"]
    user: "0:0"
    entrypoint: ["harness"]
    command: ["bench-all"]
    healthcheck:
      disable: true
    environment:
      SOURCE_DATABASE_URL: postgres://postgres:postgres@bench-source:5432/xdbc_test?sslmode=disable
      TARGET_DATABASE_URL: postgres://postgres:postgres@bench-target:5432/xdbc_test?sslmode=disable
      TRANSFER_TIMEOUT: 60m
      COMPRESSION: ${COMPRESSION:-snappy}
      DATASETS: ${DATASETS:-iot}
      JDBC: ${JDBC:-off}
      ROUNDS: ${ROUNDS:-3}
      SINKS: ${SINKS:-pg,csv}
      MACHINE: ${MACHINE:-}
      JDBC_HEAP_MB: ${JDBC_HEAP_MB:-}
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:-20m}
      SOURCE_HOST: ${SOURCE_HOST:-}
    volumes:
      - ${BENCH_DATA:-bench_data}:/data:z
      - ./bench-results:/results:z
      - bench_exports:/exports
    depends_on:
      bench-source:
        condition: service_healthy
      bench-target:
        condition: service_healthy

volumes:
  source_data:
  target_data:
  bench_source:
  bench_target:
  bench_data:
  bench_exports:
